<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <p>Keep track of your tasks!</p>

        <form method="POST" action="{{ url_for('add_task') }}" class="task-form">
            <input
                type="text"
                name="task"
                placeholder="Enter a new task..."
                class="task-input"
                required
            >
            <button type="submit" class="add-btn">Add Task</button>
        </form>

        <div class="task-list">
            {% if tasks %}
                <h2>Tasks:</h2>
                <ul>
                    {% for task in tasks %}
                        <li class="task-item {{ 'completed' if task.done else 'incomplete' }}">
                            <span>{{ task.task }}</span>
                            <form method="POST" action="{{ url_for('complete_task', index=loop.index0) }}" class="complete-form">
                                <button type="submit" class="complete-btn">
                                    {% if task.done %}
                                        Mark as Incomplete
                                    {% else %}
                                        Mark as Complete
                                    {% endif %}
                                </button>
                            </form>
                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p class="no-tasks">No tasks yet. Add one to get started!</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
